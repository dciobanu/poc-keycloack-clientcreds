version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Optional: Uncomment to specify a fixed frontend URL
      # KC_HOSTNAME_URL: http://localhost:8080
      # KC_HOSTNAME_ADMIN_URL: http://localhost:8080
    command: 
      - start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network
    restart: unless-stopped

  poc-app:
    build:
      context: ./poc-app
      dockerfile: Dockerfile
    container_name: keycloak-poc-demo
    volumes:
      - ./poc-app:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_KEYCLOAK_URL=http://keycloak:8080
      - REACT_APP_KEYCLOAK_REALM=sentinel-poc
      - REACT_APP_KEYCLOAK_CLIENT_ID=poc-ios-client
    depends_on:
      - keycloak
    networks:
      - keycloak-network
    restart: unless-stopped

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres_data: