version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: keycloak-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keycloak-network
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    command: 
      - start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10

  initializer:
    build:
      context: ./scripts
      dockerfile: Dockerfile.initializer
    container_name: keycloak-initializer
    networks:
      - keycloak-network
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  poc-app:
    build:
      context: ./poc-app
      dockerfile: Dockerfile
    container_name: keycloak-poc-demo
    volumes:
      - ./poc-app:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_KEYCLOAK_URL=http://keycloak:8080
      - REACT_APP_KEYCLOAK_REALM=sentinel-poc
      - REACT_APP_KEYCLOAK_CLIENT_ID=poc-ios-client
      - REACT_APP_KEYCLOAK_CLIENT_SECRET=267GvXWbwgppYoqcNsRVseg9JuXmqdoK
      - REACT_APP_BACKEND_URL=http://localhost:3001
    depends_on:
      - keycloak
      - backend
      - initializer
    networks:
      - keycloak-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: keycloak-backend-service
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - SERVER_PORT=3001
      - CLIENT_ORIGIN=http://localhost:3000
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=sentinel-poc
      - KEYCLOAK_CLIENT_ID=poc-ios-client
      - KEYCLOAK_CLIENT_SECRET=267GvXWbwgppYoqcNsRVseg9JuXmqdoK
      - MOBILE_CLIENT_SECRET=mobileClientSecretExample
      - WEB_CLIENT_SECRET=webClientSecretExample
    depends_on:
      - keycloak
      - initializer
    networks:
      - keycloak-network
    restart: unless-stopped

networks:
  keycloak-network:
    driver: bridge

volumes:
  postgres_data: